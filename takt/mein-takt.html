<title>Mein Takt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: eine Spalte fürs Handy, unten eine feste Leiste mit vier Bereichen; das Training läuft als Vollbild darüber. */
:root {
  --bg: #F1F4F6;
  --card: #FFFFFF;
  --sunk: #E6EBEF;
  --ink: #12202A;
  --muted: #5B6873;
  --line: #D5DDE3;
  --accent: #F2552C;       /* Energie: Training, Hauptknöpfe */
  --accent-ink: #FFFFFF;
  --water: #1C8FB0;
  --sleep: #5A55D2;
  --move: #23935A;
  --mood: #C98A06;
  --done: #23935A;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --r: 18px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D151B; --card: #16212A; --sunk: #1E2B35; --ink: #E9EEF2; --muted: #9AA8B3; --line: #2A3946;
    --accent: #FF7048; --accent-ink: #1A0B05; --water: #4CC0E0; --sleep: #9B97FF; --move: #4FCB88; --mood: #F2B53A; --done: #4FCB88;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D151B; --card: #16212A; --sunk: #1E2B35; --ink: #E9EEF2; --muted: #9AA8B3; --line: #2A3946;
  --accent: #FF7048; --accent-ink: #1A0B05; --water: #4CC0E0; --sleep: #9B97FF; --move: #4FCB88; --mood: #F2B53A; --done: #4FCB88;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 500 16px/1.45 var(--font-body); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3, p { margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

.screen {
  max-width: 560px; margin: 0 auto;
  padding-block: 18px calc(104px + env(safe-area-inset-bottom, 0px));
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  display: flex; flex-direction: column; gap: 14px;
}
.eyebrow { font: 700 0.78rem/1.2 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.h1 { font: 800 2.4rem/1 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.h2 { font: 700 1.45rem/1.1 var(--font-display); letter-spacing: 0.01em; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.num { font-variant-numeric: tabular-nums; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

.btn {
  min-height: 48px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--card); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn:active { transform: scale(0.98); }

/* Kopf "Heute" */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.ring { width: 112px; height: 112px; position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-track { stroke: var(--sunk); }
.ring-val { transition: stroke-dashoffset 0.5s ease; }
.ring-txt { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-txt b { font: 800 2rem/1 var(--font-display); }
.ring-txt span { font-size: 0.72rem; color: var(--muted); font-weight: 700; }
.chip-streak {
  display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
  padding: 5px 11px; border-radius: 99px; background: color-mix(in srgb, var(--accent) 14%, transparent);
  color: var(--ink); font-weight: 700; font-size: 0.85rem;
}
.chip-streak i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

.quick {
  background: var(--ink); color: var(--bg); border: 0; border-radius: var(--r); padding: 16px;
  display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; text-align: left; width: 100%;
}
.quick b { font: 700 1.35rem/1.1 var(--font-display); display: block; }
.quick span { font-size: 0.875rem; opacity: 0.8; }
.quick .go { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.quick .go svg { width: 22px; height: 22px; fill: currentColor; }

/* Gewohnheiten */
.habit { gap: 10px; }
.habit-head { display: flex; align-items: center; gap: 12px; }
.dot { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); }
.dot svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.habit-title { font-weight: 700; }
.habit-sub { font-size: 0.85rem; color: var(--muted); }
.state { margin-left: auto; font: 700 0.75rem/1 var(--font-body); padding: 6px 9px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.state.ok { background: color-mix(in srgb, var(--done) 16%, transparent); color: var(--done); }
.habit.is-done { border-color: color-mix(in srgb, var(--done) 45%, var(--line)); }

.glasses { display: flex; gap: 5px; flex-wrap: wrap; }
.glass { width: 22px; height: 28px; border-radius: 4px 4px 7px 7px; border: 2px solid var(--water); background: transparent; }
.glass.full { background: var(--water); }
.stepper { display: flex; gap: 8px; }
.stepper .btn { flex: 1; }
.stepper .minus { flex: 0 0 56px; }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 44px; min-width: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); font-weight: 700;
}
.chips.fit { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.chips.fit .chip { min-width: 0; padding: 0 4px; font-size: 0.9rem; }
.chip[aria-pressed="true"] { background: var(--c, var(--ink)); border-color: var(--c, var(--ink)); color: var(--card); }

.toggle {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  min-height: 56px; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--card);
}
.box { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
.box svg { width: 16px; height: 16px; fill: none; stroke: var(--card); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.toggle[aria-pressed="true"] .box { background: var(--done); border-color: var(--done); }
.toggle[aria-pressed="true"] .box svg { opacity: 1; }

.tip { background: transparent; border-style: dashed; }

/* Training */
.wo { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: start; text-align: left; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.wo-min { border-radius: 14px; background: var(--sunk); height: 64px; display: grid; place-content: center; text-align: center; }
.wo-min b { font: 800 1.9rem/0.9 var(--font-display); }
.wo-min span { font-size: 0.7rem; font-weight: 700; color: var(--muted); }
.wo h3 { font: 700 1.3rem/1.1 var(--font-display); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.tag { font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); }
.tag.hot { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.wo-list { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }
.wo.done-today .wo-min { background: color-mix(in srgb, var(--done) 18%, transparent); }

/* Spieler */
.player {
  position: fixed; inset: 0; z-index: 30; background: var(--bg);
  display: flex; flex-direction: column;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}
.player.work { --phase: var(--accent); }
.player.rest, .player.prep { --phase: var(--water); }
.p-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 560px; width: 100%; margin: 0 auto; }
.segs { display: flex; gap: 3px; max-width: 560px; width: 100%; margin: 12px auto 0; }
.segs i { flex: 1; height: 5px; border-radius: 3px; background: var(--sunk); }
.segs i.past { background: var(--ink); }
.segs i.now { background: var(--phase); }
.p-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; max-width: 560px; width: 100%; margin: 0 auto; min-height: 0; }
.p-phase { font: 700 0.85rem/1 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--phase); }
.p-name { font: 800 clamp(2.2rem, 10vw, 3.4rem)/1 var(--font-display); text-wrap: balance; }
.p-cue { color: var(--muted); max-width: 34ch; }
.p-clock { position: relative; width: min(64vw, 300px, 38vh); aspect-ratio: 1; max-width: 100%; margin: 6px 0; }
.p-clock svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.p-clock .ring-val { stroke: var(--phase); transition: none; }
.p-time { position: absolute; inset: 0; display: grid; place-items: center; font: 800 clamp(4rem, 22vw, 7rem)/1 var(--font-display); font-variant-numeric: tabular-nums; }
.p-next { font-size: 0.9rem; color: var(--muted); }
.p-next b { color: var(--ink); }
.p-ctrl { display: grid; grid-template-columns: 1fr 88px 1fr; gap: 12px; align-items: center; max-width: 420px; width: 100%; margin: 0 auto; }
.round { width: 88px; height: 88px; border-radius: 50%; border: 0; background: var(--phase); color: var(--card); display: grid; place-items: center; }
.round svg { width: 34px; height: 34px; fill: currentColor; }
.side { min-height: 56px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; }
.side svg { width: 24px; height: 24px; fill: currentColor; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.p-done { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.p-done .big { font: 800 5rem/1 var(--font-display); color: var(--done); }

/* Woche */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.stat b { font: 800 2.1rem/1 var(--font-display); display: block; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
.days7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; }
.days7 .mini { width: 100%; max-width: 44px; aspect-ratio: 1; margin: 0 auto; }
.days7 .mini svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.days7 span { font-size: 0.75rem; font-weight: 700; color: var(--muted); }
.days7 .today span { color: var(--ink); }
.bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 150px; position: relative; }
.bars .axis { display: flex; flex-direction: column; justify-content: space-between; height: 100%; font-size: 0.7rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.bar-col { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; position: relative; }
.bar { width: 100%; max-width: 30px; border-radius: 6px 6px 3px 3px; background: var(--c); min-height: 0; }
.bar.empty { background: var(--sunk); height: 4px; }
.bar-v { font-size: 0.7rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.goal { position: absolute; left: 0; right: 0; border-top: 2px dashed color-mix(in srgb, var(--ink) 35%, transparent); pointer-events: none; }
.goal span { position: absolute; right: 0; top: -18px; font-size: 0.68rem; font-weight: 700; color: var(--muted); background: var(--card); padding: 0 4px; }
.xlab { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; font-size: 0.72rem; font-weight: 700; color: var(--muted); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.cal i { aspect-ratio: 1; border-radius: 6px; background: var(--sunk); }
.cal i.l1 { background: color-mix(in srgb, var(--done) 30%, var(--sunk)); }
.cal i.l2 { background: color-mix(in srgb, var(--done) 60%, var(--sunk)); }
.cal i.l3 { background: var(--done); }
.cal i.future { background: transparent; border: 1px dashed var(--line); }
.cal i.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.cal-head { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; text-align: center; font-size: 0.72rem; font-weight: 700; color: var(--muted); }
.legend { display: flex; gap: 6px; align-items: center; font-size: 0.75rem; color: var(--muted); justify-content: flex-end; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* Ich */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.mini-step { display: flex; align-items: center; gap: 8px; }
.mini-step button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 1.3rem; font-weight: 700; }
.mini-step b { min-width: 52px; text-align: center; font: 800 1.4rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.switch { width: 52px; height: 32px; border-radius: 99px; border: 0; background: var(--line); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--card); transition: transform 0.2s; }
.switch[aria-checked="true"] { background: var(--done); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.add { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); padding: 0 14px; }
.x { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 1.2rem; }
.sync { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
.sync i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.sync.ok i { background: var(--done); }
.sync.warn i { background: var(--mood); }

/* Leiste unten */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 10px; text-decoration: none; color: var(--muted); font-size: 0.75rem; font-weight: 700; }
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabbar a[aria-current="page"] { color: var(--accent); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 40;
  bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 700; font-size: 0.9rem;
  max-width: calc(100vw - 32px); display: flex; gap: 12px; align-items: center;
}
.toast button { background: none; border: 0; color: var(--accent); font-weight: 800; padding: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LKEY = 'mein-takt-v1';

/* ── Datum ── */
const pad = (n) => String(n).padStart(2, '0');
const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const todayKey = () => keyOf(new Date());
const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const WD_LONG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const MON = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const deNum = (n) => String(n).replace('.', ',');
const mondayOf = (d) => addDays(d, -((d.getDay() + 6) % 7));

/* ── Trainings ── */
const W = (name, sec, cue) => ({ name, sec, cue });
const WORKOUTS = [
  { id: 'buero', title: 'Büro-Pause', tags: ['ohne Schwitzen', 'im Stehen'], rest: 0, intro: 'Für zwischendurch, direkt am Schreibtisch.',
    moves: [
      W('Nacken lösen', 40, 'Kopf langsam zur Seite neigen, Ohr Richtung Schulter. Seiten im Wechsel.'),
      W('Schulterkreisen', 40, 'Große Kreise nach hinten. Schultern bewusst weit weg von den Ohren.'),
      W('Brust öffnen', 40, 'Hände hinter dem Rücken verschränken, Brust nach vorn, ruhig atmen.'),
      W('Hüftbeuger links', 40, 'Großer Schritt nach vorn, hinteres Knie leicht beugen, Becken nach vorn schieben.'),
      W('Hüftbeuger rechts', 40, 'Seite wechseln. Oberkörper bleibt aufrecht.'),
      W('Wadenheben', 40, 'Auf die Zehenspitzen und langsam wieder ab. Gern am Tisch festhalten.'),
      W('Vorbeuge', 40, 'Knie locker, Oberkörper hängen lassen, Kopf schwer.'),
      W('Box-Atmung', 40, 'Vier Sekunden ein, vier halten, vier aus, vier halten.'),
    ] },
  { id: 'klassik', title: '7-Minuten-Klassiker', tags: ['Puls hoch', 'ganzer Körper'], rest: 10, intro: 'Zwölf Übungen à 30 Sekunden. Du brauchst nur einen Stuhl.',
    moves: [
      W('Hampelmann', 30, 'Locker springen, Arme über den Kopf.'),
      W('Wandsitzen', 30, 'Rücken an die Wand, Knie im rechten Winkel.'),
      W('Liegestütze', 30, 'Gern auf den Knien. Körper bleibt gerade.'),
      W('Crunches', 30, 'Schultern heben, Blick zur Decke, Nacken locker.'),
      W('Auf den Stuhl steigen', 30, 'Abwechselnd links und rechts. Stuhl gegen die Wand stellen.'),
      W('Kniebeugen', 30, 'Gewicht auf den Fersen, Po nach hinten.'),
      W('Dips am Stuhl', 30, 'Hände auf der Sitzfläche, Ellbogen nach hinten beugen.'),
      W('Unterarmstütz', 30, 'Bauch fest, Po nicht zu hoch.'),

const DEFAULT_SETTINGS = () => ({ water: 8, sleep: 7, on: { water: true, move: true, workout: true, sleep: true, mood: true }, custom: [] });

try {

  if (raw && raw.days) { S.settings = { ...DEFAULT_SETTINGS(), ...raw.settings }; S.days = raw.days; }
} catch (e) { /* ohne Browser-Speicher weiter */ }

/* ── Speichern: Browser sofort, Konto mit kurzer Verzögerung ── */
let col = null; const dirty = new Map();
function cacheLocal() { try { localStorage.setItem(LKEY, JSON.stringify({ settings: S.settings, days: S.days })); } catch (e) { /* voll oder gesperrt */ } }
function writeDoc(docId, data) {
  cacheLocal();
  if (!col) return;
  clearTimeout(dirty.get(docId));
  dirty.set(docId, setTimeout(async () => {
    try { await col.doc(docId).set(JSON.parse(JSON.stringify(data))); setSync('ok'); }
    catch (e) { setSync('warn', e && e.code); }
    finally { dirty.delete(docId); }
  }, 500));
}
const saveDay = (k = todayKey()) => writeDoc('d-' + k, day(k));
const saveSettings = () => writeDoc('settings', S.settings);

function setSync(state, code) {
  S.sync = state; S.syncCode = code;
  if (S.tab === 'ich') render();
}
async function connect() {
  const use = window.claude && window.claude.use;
  if (!use) return;
  const [db, user] = await Promise.all([use('db'), use('user')]);
  if (!db || !user) return;
  const id = await user.id();
  if (!id) return;
  col = db.collection('data/users/' + id);
  setSync('loading');
  const timer = setTimeout(() => setSync('warn', 'timeout'), 10000);
  let first = true;
  col.onSnapshot((snap) => {
    clearTimeout(timer);
    if (first) {
      first = false;
      if (snap.empty) {
        // Erster Start im Konto: was bisher im Browser lag, mitnehmen.
        if (Object.keys(S.days).length) Object.keys(S.days).forEach((k) => saveDay(k));
        saveSettings();
        setSync('ok'); return;
      }
    }
    snap.docs.forEach((d) => {
      if (dirty.has(d.id)) return;
      const v = d.data(); if (!v) return;
      if (d.id === 'settings') S.settings = { ...DEFAULT_SETTINGS(), ...v };
      else if (d.id.startsWith('d-')) S.days[d.id.slice(2)] = { custom: {}, workouts: [], ...v };
    });
    cacheLocal(); setSync('ok'); render();
  }, (e) => { clearTimeout(timer); setSync('warn', e && e.code); });
}

function goals() {
  const s = S.settings, list = [];
  if (s.on.water) list.push({ id: 'water', met: (d) => d.water >= s.water });
  if (s.on.move) list.push({ id: 'move', met: (d) => !!d.move });
  if (s.on.workout) list.push({ id: 'workout', met: (d) => (d.workouts || []).length > 0 });
  if (s.on.sleep) list.push({ id: 'sleep', met: (d) => d.sleep != null && d.sleep >= s.sleep });
  if (s.on.mood) list.push({ id: 'mood', met: (d) => d.mood != null });
  s.custom.forEach((c) => list.push({ id: c.id, met: (d) => !!(d.custom && d.custom[c.id]) }));
  return list;
}
function score(k) {
  const d = S.days[k], g = goals();
  if (!d || !g.length) return { done: 0, total: g.length, pct: 0 };
  const done = g.filter((x) => x.met(d)).length;
  return { done, total: g.length, pct: done / g.length };
}
function streak() {
  let n = 0, d = new Date();
  if (score(keyOf(d)).pct < 0.8) d = addDays(d, -1);
  while (score(keyOf(d)).pct >= 0.8) { n++; d = addDays(d, -1); }
  return n;
}

/* ── Ansicht: Woche ── */
function viewWoche() {
  const now = new Date(), mon = mondayOf(now), s = S.settings;
  const week = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
  const wk = week.map((d) => S.days[keyOf(d)]);
  const logged = wk.filter(Boolean);
  const wos = logged.reduce((a, d) => a + (d.workouts || []).length, 0);
  const mins = logged.reduce((a, d) => a + (d.workouts || []).reduce((b, w) => b + (w.min || 0), 0), 0);
  const sl = logged.filter((d) => d.sleep != null);
  const avgSleep = sl.length ? sl.reduce((a, d) => a + d.sleep, 0) / sl.length : null;
  const anyData = Object.keys(S.days).some((k) => { const d = S.days[k]; return d.water || d.move || d.sleep != null || d.mood != null || (d.workouts || []).length; });
  const out = [`<div><span class="eyebrow">KW ${isoWeek(now)} · ${mon.getDate()}. ${MON[mon.getMonth()].slice(0, 3)} bis ${week[6].getDate()}. ${MON[week[6].getMonth()].slice(0, 3)}</span><h1 class="h1">Deine Woche</h1></div>`];
  if (!anyData) out.push(`<section class="card tip"><span class="h2">Hier wächst deine Woche</span><p class="muted">Sobald du unter „Heute“ etwas einträgst, siehst du hier Wasser, Schlaf, Trainings und deine Serie.</p><a class="btn primary" href="#heute" style="text-decoration:none">Zu Heute</a></section>`);
  out.push(`<div class="stats">
    <div class="stat"><b>${wos}</b><span>Trainings diese Woche</span></div>
    <div class="stat"><b>${mins}</b><span>Minuten trainiert</span></div>
    <div class="stat"><b>${avgSleep == null ? '–' : deNum(avgSleep.toFixed(1))}</b><span>Ø Stunden Schlaf</span></div>
    <div class="stat"><b>${streak()}</b><span>Tage in Folge ≥ 80 %</span></div>
  </div>`);
  out.push(`<section class="card"><h2 class="h2">Tage</h2><div class="days7">${week.map((d) => {
    const k = keyOf(d), sc = score(k), fut = d > now && k !== keyOf(now);
    return `<div class="${k === keyOf(now) ? 'today' : ''}"><div class="mini" role="img" aria-label="${WD_LONG[d.getDay()]}: ${fut ? 'noch nicht' : Math.round(sc.pct * 100) + ' %'}">${ringSvg(fut ? 0 : sc.pct, sc.pct >= 0.8 ? 'var(--done)' : 'var(--accent)', 14)}</div><span>${WD[d.getDay()]}</span></div>`;
  }).join('')}</div></section>`);
  if (s.on.water) out.push(barChart('Wasser', 'Gläser', week, wk.map((d) => (d ? d.water : null)), s.water, 'var(--water)', (v) => v));
  if (s.on.sleep) out.push(barChart('Schlaf', 'Stunden', week, wk.map((d) => (d ? d.sleep : null)), s.sleep, 'var(--sleep)', deNum));
  out.push(calendar(now));
  return out.join('');
}
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
}
function barChart(title, unit, week, vals, goal, color, fmt) {
  const top = Math.max(goal * 1.25, ...vals.filter((v) => v != null));
  const max = Math.ceil(top / (unit === 'Stunden' ? 2 : 4)) * (unit === 'Stunden' ? 2 : 4);
  const H = 150, labelSpace = 18, plot = H - labelSpace;
  const goalPct = goal / max;
  return `<section class="card"><div class="row between"><h2 class="h2">${title}</h2><span class="muted small">${unit} pro Tag</span></div>
    <div class="bars" style="--c:${color}">
      ${vals.map((v) => `<div class="bar-col">${v == null || v === 0 ? '<div class="bar empty"></div>' : `<span class="bar-v">${fmt(v)}</span><div class="bar" style="height:${((v / max) * plot).toFixed(1)}px"></div>`}</div>`).join('')}
      <div class="goal" style="bottom:${(goalPct * plot).toFixed(1)}px"><span>Ziel ${fmt(goal)}</span></div>
    </div>
    <div class="xlab">${week.map((d) => `<span>${WD[d.getDay()]}</span>`).join('')}</div>
  </section>`;
}
function calendar(now) {
  const start = addDays(mondayOf(now), -28);
  const cells = Array.from({ length: 35 }, (_, i) => {
    const d = addDays(start, i), k = keyOf(d);
    if (d > now && k !== keyOf(now)) return '<i class="future"></i>';
    const p = score(k).pct, lv = p >= 0.8 ? 3 : p >= 0.5 ? 2 : p > 0 ? 1 : 0;
    return `<i class="l${lv}${k === keyOf(now) ? ' today' : ''}" title="${d.getDate()}.${d.getMonth() + 1}.: ${Math.round(p * 100)} %"></i>`;
  }).join('');
  return `<section class="card"><div class="row between"><h2 class="h2">Fünf Wochen</h2></div>
    <div class="cal-head">${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map((x) => `<span>${x}</span>`).join('')}</div>
    <div class="cal" role="img" aria-label="Erledigte Ziele der letzten fünf Wochen">${cells}</div>
    <div class="legend">wenig <i style="background:var(--sunk)"></i><i style="background:color-mix(in srgb, var(--done) 30%, var(--sunk))"></i><i style="background:color-mix(in srgb, var(--done) 60%, var(--sunk))"></i><i style="background:var(--done)"></i> 80 % und mehr</div>
  </section>`;
}

    loading: ['', 'Verbinde mit deinem Konto …'],
    warn: ['warn', 'Speichern im Konto klappt gerade nicht. Deine Einträge bleiben in diesem Browser und werden beim nächsten Öffnen erneut gesendet.'],
    local: ['warn', 'Gespeichert nur in diesem Browser. Melde dich bei Claude an, damit deine Daten geräteübergreifend erhalten bleiben.'],
  }[S.sync] || ['', ''];
  return `<div><span class="eyebrow">Einstellungen</span><h1 class="h1">Deine Ziele</h1></div>
  <section class="card">
    <div class="set-row"><div><div class="habit-title">Wasser pro Tag</div><div class="habit-sub num">Gläser à 250 ml · ${deNum(s.water * 0.25)} l</div></div>
      <div class="mini-step"><button type="button" data-goal="water" data-d="-1" aria-label="Weniger">−</button><b>${s.water}</b><button type="button" data-goal="water" data-d="1" aria-label="Mehr">+</button></div></div>
    <div class="set-row"><div><div class="habit-title">Schlaf pro Nacht</div><div class="habit-sub">Stunden</div></div>
      <div class="mini-step"><button type="button" data-goal="sleep" data-d="-0.5" aria-label="Weniger">−</button><b>${deNum(s.sleep)}</b><button type="button" data-goal="sleep" data-d="0.5" aria-label="Mehr">+</button></div></div>
  </section>
  <section class="card"><h2 class="h2">Was du verfolgst</h2>
    <div>${Object.keys(HABIT_NAMES).map((k) => `<div class="set-row"><span class="habit-title">${HABIT_NAMES[k]}</span><button class="switch" type="button" role="switch" data-on="${k}" aria-checked="${s.on[k]}" aria-label="${HABIT_NAMES[k]} verfolgen"></button></div>`).join('')}</div>
  </section>
  <section class="card"><h2 class="h2">Eigene Ziele</h2>
    <p class="muted small">Zum Beispiel „Vitamin D genommen“, „Kein Handy im Bett“ oder „10 Minuten dehnen“.</p>
    ${s.custom.map((c) => `<div class="set-row"><span class="grow">${esc(c.name)}</span><button class="x" type="button" data-del="${esc(c.id)}" aria-label="${esc(c.name)} löschen">×</button></div>`).join('')}
    <form class="add" id="addForm"><input id="addName" maxlength="40" placeholder="Neues Ziel" autocomplete="off" aria-label="Neues Ziel"><button class="btn primary" type="submit">Hinzufügen</button></form>
  </section>
  <section class="card"><div class="sync ${sync[0]}"><i></i><span>${sync[1]}</span></div></section>`;
}

/* ── Rendern + Navigation ── */
const VIEWS = { heute: viewHeute, training: viewTraining, woche: viewWoche, ich: viewIch };
function render() {
  if (document.activeElement && document.activeElement.id === 'addName') return;
  const app = $('#app');
  app.className = 'screen';
  app.innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('.tabbar a').forEach((a) => { if (a.dataset.tab === S.tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
}
function route() {
  const t = location.hash.slice(1);
  S.tab = VIEWS[t] ? t : 'heute';
  render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

let toastT;
function toast(msg, action, fn) {
  const t = $('#toast'); t.textContent = msg;
  if (action) { const b = document.createElement('button'); b.type = 'button'; b.textContent = action; b.onclick = () => { fn(); t.hidden = true; }; t.append(b); }
  t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, action ? 5000 : 2200);
}
const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* nicht verfügbar */ } };

$('#app').addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  const d = day(), s = S.settings;
  if (t.dataset.start) return startWorkout(t.dataset.start);
  if (t.dataset.act === 'water+') { d.water++; buzz(15); if (d.water === s.water) toast('Wasserziel geschafft'); }
  else if (t.dataset.act === 'water-') d.water = Math.max(0, d.water - 1);
  else if (t.dataset.act === 'move') d.move = !d.move;
  else if (t.dataset.sleep) { const v = +t.dataset.sleep; d.sleep = d.sleep === v ? null : v; }
  else if (t.dataset.mood) { const v = +t.dataset.mood; d.mood = d.mood === v ? null : v; }
  else if (t.dataset.custom) { d.custom[t.dataset.custom] = !d.custom[t.dataset.custom]; }
  else if (t.dataset.goal) {
    const k = t.dataset.goal, lim = k === 'water' ? [2, 16] : [5, 10];
    s[k] = Math.min(lim[1], Math.max(lim[0], s[k] + +t.dataset.d)); saveSettings(); return render();
  } else if (t.dataset.on) { s.on[t.dataset.on] = !s.on[t.dataset.on]; saveSettings(); return render(); }
  else if (t.dataset.del) {
    const i = s.custom.findIndex((c) => c.id === t.dataset.del), item = s.custom[i];
    s.custom.splice(i, 1); saveSettings(); render();
    return toast('Ziel gelöscht', 'Rückgängig', () => { s.custom.splice(i, 0, item); saveSettings(); render(); });
  } else return;
  saveDay(); render();
  const again = document.querySelector(Object.entries(t.dataset).map(([k, v]) => `[data-${k}="${CSS.escape(v)}"]`).join(''));
  if (again && e.detail === 0) again.focus();
});
$('#app').addEventListener('submit', (e) => {
  e.preventDefault();
  const inp = $('#addName'), name = inp.value.trim();
  if (!name) return inp.focus();
  S.settings.custom.push({ id: 'c' + Date.now().toString(36), name });
  saveSettings(); inp.value = ''; inp.blur(); render(); toast('Ziel hinzugefügt, du findest es unter Heute');
});

/* ── Training abspielen ── */
let P = null, ac = null, wake = null;
function tone(f, ms, vol = 0.18) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.frequency.value = f; o.type = 'sine';
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + ms / 1000);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + ms / 1000);
}
async function keepAwake() { try { wake = await navigator.wakeLock.request('screen'); } catch (e) { wake = null; } }
function startWorkout(id) {
  const w = byId(id);
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) { ac = null; }
  const steps = [{ kind: 'prep', name: 'Gleich geht’s los', cue: w.moves[0].name + ' als Erstes. Mach dich bereit.', sec: 5 }];
  w.moves.forEach((m, i) => {
    steps.push({ kind: 'work', ...m, idx: i });
    if (w.rest && i < w.moves.length - 1) steps.push({ kind: 'rest', name: 'Pause', cue: 'Durchatmen. Als Nächstes: ' + w.moves[i + 1].name + '.', sec: w.rest });
  });
  P = { w, steps, i: 0, left: steps[0].sec * 1000, last: performance.now(), paused: false, lastBeep: null, done: false };
  keepAwake();
  $('#player').hidden = false;
  document.body.style.overflow = 'hidden';
  drawPlayer(true); tick();
}
function stopWorkout() {
  P = null; $('#player').hidden = true; document.body.style.overflow = '';
  try { wake && wake.release(); } catch (e) { /* schon frei */ } wake = null;
  render();
}
function finishWorkout() {
  const d = day();
  d.workouts.push({ id: P.w.id, min: P.w.min, at: new Date().toISOString() });
  saveDay(); P.done = true; tone(660, 160); setTimeout(() => tone(880, 160), 180); setTimeout(() => tone(1320, 380), 360); buzz([80, 60, 160]);
  drawPlayer(true);
}
function go(n) {
  if (!P || P.done) return;
  P.i = Math.max(0, Math.min(P.steps.length - 1, P.i + n));
  P.left = P.steps[P.i].sec * 1000; P.lastBeep = null; drawPlayer(true);
}
function tick() {
  if (!P || P.done) return;
  const now = performance.now(), dt = now - P.last; P.last = now;
  if (!P.paused) {
    P.left -= dt;
    const s = Math.ceil(P.left / 1000);
    if (s <= 3 && s >= 1 && P.lastBeep !== s) { P.lastBeep = s; tone(620, 110); }
    if (P.left <= 0) {
      if (P.i >= P.steps.length - 1) return finishWorkout();
      P.i++; P.left += P.steps[P.i].sec * 1000; P.lastBeep = null;
      tone(P.steps[P.i].kind === 'work' ? 990 : 520, 280); buzz(120);
      drawPlayer(true);
    } else drawPlayer(false);
  }
  setTimeout(tick, 100);
}
const PAUSE_I = '<svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>';
const PREV_I = '<svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 5v14L9 12z"/></svg>';
const NEXT_I = '<svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5v14l10-7z"/></svg>';
const CLOSE_I = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function drawPlayer(full) {
  const el = $('#player'); if (!P) return;
  if (P.done) {
    el.className = 'player';
    el.innerHTML = `<div class="p-main"><div class="p-done"><span class="eyebrow">${esc(P.w.title)}</span><span class="big num">${P.w.min} Min.</span><h2 class="p-name">Stark gemacht.</h2><p class="p-cue">Dein Training ist für heute eingetragen.${streak() ? ` Serie: ${streak()} ${streak() === 1 ? 'Tag' : 'Tage'}.` : ''}</p><button class="btn primary" type="button" data-p="close" style="min-width:200px">Fertig</button></div></div>`;
    return;
  }
  const st = P.steps[P.i], sec = Math.max(0, Math.ceil(P.left / 1000)), r = 46, c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, P.left) / (st.sec * 1000));
  if (!full) {
    $('.p-time', el).textContent = sec;
    $('.p-clock .ring-val', el).setAttribute('stroke-dashoffset', off.toFixed(1));
    return;
  }
  const workIdx = P.steps.filter((x) => x.kind === 'work');
  const nextWork = P.steps.slice(P.i + 1).find((x) => x.kind === 'work');
  const phase = { prep: 'Bereit machen', rest: 'Pause', work: `Übung ${st.idx + 1} von ${workIdx.length}` }[st.kind];
  el.className = 'player ' + st.kind;
  el.innerHTML = `
    <div class="p-top"><div><span class="eyebrow">${esc(P.w.title)}</span></div><button class="icon-btn" type="button" data-p="close" aria-label="Training beenden">${CLOSE_I}</button></div>
    <div class="segs" aria-hidden="true">${workIdx.map((x) => `<i class="${x.idx < (st.kind === 'work' ? st.idx : (P.steps.slice(P.i).find((y) => y.kind === 'work') || { idx: workIdx.length }).idx) ? 'past' : st.kind === 'work' && x.idx === st.idx ? 'now' : ''}"></i>`).join('')}</div>
    <div class="p-main">
      <span class="p-phase">${P.paused ? 'Pausiert' : phase}</span>
      <h2 class="p-name">${esc(st.name)}</h2>
      <div class="p-clock">${'<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-track" cx="50" cy="50" r="46" fill="none" stroke-width="6"/><circle class="ring-val" cx="50" cy="50" r="46" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/></svg>'}<div class="p-time" aria-live="off">${sec}</div></div>
      <p class="p-cue">${esc(st.cue)}</p>
      <p class="p-next">${nextWork ? `Danach: <b>${esc(nextWork.name)}</b>` : 'Letzte Runde, gleich geschafft.'}</p>
    </div>
    <div class="p-ctrl">
      <button class="side" type="button" data-p="prev" aria-label="Zurück">${PREV_I}</button>
      <button class="round" type="button" data-p="toggle" aria-label="${P.paused ? 'Weiter' : 'Pause'}">${P.paused ? PLAY : PAUSE_I}</button>
      <button class="side" type="button" data-p="next" aria-label="Überspringen">${NEXT_I}</button>
    </div>`;
}
$('#player').addEventListener('click', (e) => {
  const b = e.target.closest('[data-p]'); if (!b || !P) return;
  const a = b.dataset.p;
  if (a === 'close') {
    if (P.done) return stopWorkout();
    if (!P.confirm) { P.confirm = true; toast('Nochmal tippen zum Beenden'); setTimeout(() => { if (P) P.confirm = false; }, 2500); return; }
    return stopWorkout();
  }
  if (a === 'toggle') { P.paused = !P.paused; P.last = performance.now(); if (!P.paused) keepAwake(); drawPlayer(true); }
  if (a === 'prev') go(-1);
  if (a === 'next') { if (P.i >= P.steps.length - 1) return finishWorkout(); go(1); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && P && !P.done) keepAwake(); });

/* Tageswechsel ohne Neuladen */
let lastKey = todayKey();
setInterval(() => { if (todayKey() !== lastKey) { lastKey = todayKey(); if (!P) render(); } }, 60000);

route();
connect().catch(() => setSync('warn'));
})();
</script>
